name: Validate Quant Telegram Candidate

on:
  push:
    branches:
      - fix/modelos-independientes-por-liga-2026-11-08
    paths:
      - "supabase/functions/quant-telegram/**"

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Function
        run: deno check supabase/functions/quant-telegram/index.ts
